interface:
  display_name: "Readable Patent Generator"
  short_description: "Generate evidence-bound Chinese patent disclosures and claims."
  default_prompt: "Use $readable-patent-generator to extract invention points from local materials, apply fact-driven examination rules, run the preview-first disclosure model 4.0 and claims map 3.0 workflow, and stop when evidence-bound review or human confirmations are missing. Write only in the current local work folder or an explicitly selected research root, and treat the installed skill directory as read-only."
policy:
  allow_implicit_invocation: true
